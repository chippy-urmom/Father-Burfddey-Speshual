<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday, Dad</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="cover-page">

        <div class="background-shape shape-one"></div>
        <div class="background-shape shape-two"></div>

        <div class="paper-note note-left">
            made with love
        </div>

        <div class="paper-note note-right">
            just for dad
        </div>


        <section class="birthday-card">

            <div class="top-decoration">
                <span></span>
                <span></span>
                <span></span>
            </div>


            <p class="eyebrow">
                A LITTLE SOMETHING MADE JUST FOR YOU
            </p>


            <h1>
                Happiest<br>
                Birthday, D
            </h1>


            <p class="subtitle">
                Your special day starts here
            </p>


            <a href="home.html" class="gift-link">

                <div class="gift">

                    <div class="bow">
                        <div class="bow-left"></div>
                        <div class="bow-right"></div>
                        <div class="bow-center"></div>
                    </div>

                    <div class="gift-lid">
                        <div class="lid-ribbon"></div>
                    </div>

                    <div class="gift-box">
                        <div class="vertical-ribbon"></div>
                        <div class="horizontal-ribbon"></div>
                    </div>

                </div>

            </a>


            <p class="instruction">
                Click the gift to open your surprise
            </p>


            <a href="home.html" class="open-button">
                OPEN
                <span>→</span>
            </a>


            <div class="bottom-decoration">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </section>

    </main>

</body>
</html>
