<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>August 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #FFF4EB;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .page {
      max-width: 750px;
      width: 100%;
      background: #FFF4EB;
      padding: 2rem;
      border-radius: 48px;
      box-shadow: 0 20px 40px -12px rgba(61,21,52,0.2);
      border: 1px solid rgba(166,188,201,0.3);
      text-align: center;
    }
    h1 {
      font-family: 'Georgia', serif;
      font-size: 3rem;
      color: #3E4B8E;
      text-shadow: 3px 3px 0 #F6E0B6;
    }
    .subhead {
      font-size: 1.1rem;
      color: #3D1534;
      opacity: 0.75;
      border-bottom: 2px dashed #A6BCC9;
      padding-bottom: 0.5rem;
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
      margin: 1.5rem 0;
    }
    .day {
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 600;
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      color: #3D1534;
    }
    .header {
      font-size: 0.7rem;
      font-weight: 700;
      color: #3E4B8E;
      opacity: 0.6;
      text-transform: uppercase;
      background: transparent;
    }
    .empty { background: transparent; }
    .birthday {
      background: #3E4B8E;
      color: #FFF4EB;
      border: 4px solid #F6E0B6;
      box-shadow: 0 0 0 4px #3E4B8E;
      transform: scale(1.1);
      font-size: 1.5rem;
      position: relative;
    }
    .birthday::after {
      content: "🎂";
      position: absolute;
      top: -18px;
      right: -10px;
      font-size: 1.2rem;
    }
    .message {
      background: rgba(246,224,182,0.3);
      padding: 1.5rem;
      border-radius: 60px 20px 60px 20px;
      border: 2px solid #F6E0B6;
      margin: 1.5rem 0;
    }
    .message h2 {
      font-family: 'Georgia', serif;
      font-size: 1.8rem;
      color: #3E4B8E;
    }
    .big {
      font-family: 'Georgia', serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: #3E4B8E;
    }
    .nav-link {
      font-weight: 600;
      color: #3E4B8E;
      background: #FFF4EB;
      padding: 0.5rem 1.8rem;
      border-radius: 60px;
      text-decoration: none;
      border: 1px solid #A6BCC9;
      display: inline-block;
      margin: 0.5rem;
    }
    .credit {
      color: #3D1534;
      opacity: 0.5;
      margin-top: 1.5rem;
    }
    .credit span {
      background: #FFF4EB;
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
      font-weight: 600;
      color: #3E4B8E;
    }
  </style>
</head>
<body>
<div class="page">
  <h1>🗓️ August 2026</h1>
  <div class="subhead">✦ D's Birthday Month ✦</div>

  <div class="grid">
    <div class="header">Mon</div>

    <div class="header">Wed</div>
    <div class="header">Thu</div>
    <div class="header">Fri</div>

    <div class="empty"></div><div class="empty"></div><div class="empty"></div>
    <div class="empty"></div><div class="empty"></div>
    <div class="day">1</div><div class="day">2</div>
    <div class="day">3</div><div class="day">4</div><div class="day">5</div>
    <div class="day">6</div><div class="day">7</div><div class="day">8</div>
    <div class="day">9</div>
    <div class="day">10</div><div class="day">11</div><div class="day">12</div>
    <div class="day">13</div><div class="day">14</div><div class="day">15</div>
    <div class="day">16</div>
    <div class="day">17</div><div class="day">18</div><div class="day">19</div>
    <div class="day birthday">20</div>
    <div class="day">21</div><div class="day">22</div><div class="day">23</div>
    <div class="day">24</div><div class="day">25</div><div class="day">26</div>
    <div class="day">27</div><div class="day">28</div><div class="day">29</div>
    <div class="day">30</div>
    <div class="day">31</div><div class="empty"></div><div class="empty"></div>
    <div class="empty"></div><div class="empty"></div><div class="empty"></div>
  </div>

  <div class="message">
    <div class="big">🎂 20 🎂</div>
    <h2>D's Day!</h2>
    <p><strong>20 August 1975</strong> — the world got a little brighter.<br>Celebrating <strong>51 years</strong> of you, D! ✨</p>
  </div>

  <div>

        <a href="home.html" class="nav-link" style="margin: 0;">← Gift</a>
        
        <!-- Center & Bottom Text (NO span tags, directly in the div!) -->
        <div style="font-family: 'Playfair Display', 'Times New Roman', serif; font-weight: 400; color: #9EA4B8; font-size: 15px; letter-spacing: 0.5px; flex-grow: 1; text-align: center; margin-top: 20px;">
            SHIMDY@nixxcer
        </div>
        
        <!-- Right Button: Cake -->
        <a href="cake.html" class="nav-link" style="margin: 0;">Cake →</a>
    </div>
</div> <!-- Closes the page div -->
</body>
</html>
